<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
        }
        img{
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="">
            <img src = "gallery_images/A.jpg" alt = "Image A">
        </div>
        <div class="">
            <img src = "gallery_images/B.jpg" alt = "Image B">
        </div>
        <div class="">
            <img src = "gallery_images/C.jpg" alt = "Image C">
        </div>
        <div class="">
            <img src = "gallery_images/D.jpg" alt = "Image D">
        </div>
        <div class="">
            <img src = "gallery_images/E.jpg" alt = "Image E">
        </div>
        <div class="">
            <img src = "gallery_images/F.jpg" alt = "Image F">
        </div>
        <div class="">
            <img src = "gallery_images/G.jpg" alt = "Image G">
        </div>
        <div class="">
            <img src = "gallery_images/H.jpg" alt = "Image H">
        </div>
        <div class="">
            <img src = "gallery_images/I.jpg" alt = "Image I">
        </div>
    </div>
    
</body>
</html>
